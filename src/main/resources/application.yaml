spring:
  application:
    name: NutriCheckBackend

  # JPA 설정 / JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update  # 애플리케이션 시작 시 테이블 자동 생성/수정 / Auto-create/update tables on startup
    show-sql: true  # SQL 쿼리 콘솔 출력 / Show SQL queries in console
    properties:
      hibernate:
        format_sql: true  # SQL 포맷팅 / Format SQL queries
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false  # OSIV 비활성화 (성능 최적화) / Disable OSIV for performance

  # H2 데이터베이스 설정 / H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:nutricheck  # 인메모리 데이터베이스 / In-memory database
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 콘솔 활성화 (개발용) / Enable H2 console for development
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  servlet:
    context-path: /api/v1
