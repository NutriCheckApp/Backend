spring:
  application:
    name: NutriCheckBackend

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  datasource:
    url: jdbc:h2:mem:nutricheck
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  servlet:
    context-path: /api/v1

nutricheck:
  jwt:
    secret: 6AF90...
    expiration: 8640000

calendar:
  test-mode: true